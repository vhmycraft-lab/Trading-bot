[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantlab"
version = "0.1.0"
description = "AI-assisted quantitative trading research and paper-trading platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "numpy~=2.1", "pandas~=2.2", "pyarrow~=17.0", "scipy~=1.14",
  "pydantic~=2.9", "pydantic-settings~=2.5", "pyyaml~=6.0",
  "sqlalchemy~=2.0", "alembic~=1.13",
  "typer~=0.12", "rich~=13.9", "structlog~=24.4",
  "httpx~=0.27", "tenacity~=9.0",
  "optuna~=4.0",
  "ccxt~=4.4",
  "keyring~=25.4", "python-dotenv~=1.0",
  "matplotlib~=3.9",
  "websockets~=13.1",
]

[project.optional-dependencies]
dev = ["pytest~=8.3", "pytest-cov~=5.0", "hypothesis~=6.115", "mypy~=1.11", "ruff~=0.6",
       "pre-commit~=4.0", "pip-audit~=2.7", "freezegun~=1.5", "respx~=0.21", "pandas-stubs", "types-PyYAML"]
dashboard = ["streamlit~=1.39"]

[project.scripts]
quantlab = "quantlab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

# ----------------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "SIM",              # simplify
  "TID",              # tidy imports
  "RUF",              # ruff-specific
  "S",                # bandit
  "PTH",              # use pathlib
  "DTZ",              # naive datetimes
  "ARG",              # unused arguments
  "RET",              # return conventions
]
ignore = [
  "S101",    # assert is used deliberately for engine/segment invariants
  "RET504",  # named return values aid readability in numeric code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PTH"]
"scripts/**" = ["S", "PTH"]
"migrations/**" = ["ARG", "PTH", "I"]

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]

# ----------------------------------------------------------------------------
# mypy — strict on core/, ports/, sandbox/; normal elsewhere (spec section 4)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["quantlab"]
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
# Re-add "quantlab.sandbox.*" here when the sandbox package lands (spec phase D, T17).
module = ["quantlab.core.*", "quantlab.ports.*"]
strict = true

[[tool.mypy.overrides]]
module = ["keyring", "keyring.*", "alembic", "alembic.*", "ccxt"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
  "live: requires network and real credentials; excluded from `make check`",
  "slow: long-running test",
]
filterwarnings = ["error::DeprecationWarning:quantlab.*"]

# ----------------------------------------------------------------------------
# coverage
# ----------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/quantlab"]
omit = ["src/quantlab/dashboard/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
