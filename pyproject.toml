[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantlab"
version = "0.1.0"
description = "AI-assisted quantitative trading research and paper-trading platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "numpy~=2.1", "pandas~=2.2", "pyarrow~=17.0", "scipy~=1.14",
  "pydantic~=2.9", "pydantic-settings~=2.5", "pyyaml~=6.0",
  "sqlalchemy~=2.0", "alembic~=1.13",
  "typer~=0.12", "rich~=13.9", "structlog~=24.4",
  "httpx~=0.27", "tenacity~=9.0",
  "optuna~=4.0",
  "ccxt~=4.4",
  "keyring~=25.4", "python-dotenv~=1.0",
  "matplotlib~=3.9",
  "websockets~=13.1",
]

[project.optional-dependencies]
dev = ["pytest~=8.3", "pytest-cov~=5.0", "hypothesis~=6.115", "mypy~=1.11", "ruff~=0.6",
       "pre-commit~=4.0", "pip-audit~=2.7", "freezegun~=1.5", "respx~=0.21", "pandas-stubs", "types-PyYAML"]
dashboard = ["streamlit~=1.39"]

[project.scripts]
quantlab = "quantlab.cli:app"
# A separate binary, not a subcommand: spec section 14.6 forbids the research CLI
# from importing cli/lockbox.py, and the surest way to keep that import from
# happening is for the research binary to have no lockbox command to route to.
quantlab-lockbox = "quantlab.cli.lockbox:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

# ----------------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Ruff formats Python blocks embedded in Markdown. The specification and the
# design docs use compact illustrative signatures (`bar_index: int; side: Side`)
# that are documentation, not source; reflowing them to source style makes them
# markedly longer and harder to scan. Prose is reviewed by reading it.
# `tests/fixtures/strategies/rejected/` holds deliberately unsafe strategy source:
# it is test *input* for the AST checker, never imported, and every file breaks a
# rule on purpose. Linting it would report the defects the fixtures exist to carry.
# `rejected` holds sources whose defects the AST checker exists to detect, and
# `generated` holds compiled genomes stored under the hash of their own bytes:
# formatting either one in place would rewrite the very thing under test.
extend-exclude = ["*.md", "tests/fixtures/strategies/rejected", "strategies/generated"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "SIM",              # simplify
  "TID",              # tidy imports
  "RUF",              # ruff-specific
  "S",                # bandit
  "PTH",              # use pathlib
  "DTZ",              # naive datetimes
  "ARG",              # unused arguments
  "RET",              # return conventions
]
ignore = [
  "S101",    # assert is used deliberately for engine/segment invariants
  "RET504",  # named return values aid readability in numeric code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PTH"]
"scripts/**" = ["S", "PTH"]
"migrations/**" = ["ARG", "PTH", "I"]
# Strategy modules have the fixed declarative shape of spec section 9.4:
# a class with class-level `params`, and an `on_bar` that may legitimately
# ignore its context. Adding ClassVar noise to each would fight the template
# the specification prescribes, and the AST checker restricts their imports.
"strategies/**" = ["RUF012", "ARG002"]
"tests/fixtures/strategies/**" = ["RUF012", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]

# ----------------------------------------------------------------------------
# mypy — strict on core/, ports/, sandbox/; normal elsewhere (spec section 4)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["quantlab"]
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["quantlab.core.*", "quantlab.ports.*", "quantlab.sandbox.*"]
strict = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Listed by name rather
# than silenced globally, so a missing stub for one of *our* modules is still
# an error.
module = ["keyring", "keyring.*", "alembic", "alembic.*", "ccxt", "scipy", "scipy.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
  "live: requires network and real credentials; excluded from `make check`",
  "slow: long-running test",
]
filterwarnings = ["error::DeprecationWarning:quantlab.*"]

# ----------------------------------------------------------------------------
# coverage
# ----------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/quantlab"]
omit = ["src/quantlab/dashboard/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
