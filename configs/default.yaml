# Authoritative default configuration (master spec section 5).
# Changing a threshold, split boundary or cost default requires an ADR in docs/DECISIONS/.
# Secrets NEVER live here — see .env.example and docs/SECURITY.md.

project:
  name: quantlab
  data_dir: ./data
  artifacts_dir: ./artifacts
  db_path: ./quantlab.db
  timezone: UTC                   # informational; all internals are UTC ms

market:
  exchange: binance
  symbol: BTC/USDT
  timeframe: 1h
  lot_step: 0.00001
  min_notional: 5.0

backtest:
  initial_equity: 10000.0
  fill_rule: next_open            # only value in v1; next_close reserved for stress tests
  allow_short: false
  short_borrow_bps_per_bar: 0.0
  fee_bps: 10.0
  slippage:
    model: fixed_bps              # fixed_bps | volatility_scaled | volume_impact
    fixed_bps: 5.0
    vol_k: 0.10                   # bps = vol_k * ATR14/close * 1e4
    impact_a_bps: 2.0
    impact_b: 50.0                # bps += impact_b * notional / bar_quote_volume
  cost_stress_multipliers: [1.0, 2.0, 3.0]
  max_position_fraction: 1.0

splits:
  policy_file: configs/splits/btcusdt_1h.yaml

optimize:                         # parameter refinement of a promoted candidate (spec 13.8)
  engine: evolution               # evolution | optuna  -- which search produces candidates
  sampler: tpe                    # tpe | random | grid
  n_trials: 200
  timeout_s: 1800
  seed: 42
  objective: sortino_dd           # sortino_dd | sharpe | calmar | expectancy  (net_return is FORBIDDEN)
  min_trades: 30
  dd_lambda: 0.5
  plateau:
    top_k: 10
    perturbation_pcts: [0.10, 0.25]
    n_neighbors: 12

# ---------------------------------------------------------------------------
# Evolutionary optimisation (spec section 13).
#
# SCHEMA ONLY at this point: these keys are parsed and validated, and nothing
# reads them yet. The optimiser itself lands in phase F' (T45-T54). They are
# declared now so that the shipped configuration matches specification v1.1 and
# so that a value that could not work is rejected before any code depends on it.
# ---------------------------------------------------------------------------
evolution:
  enabled: true
  population_size: 32             # Project Rome section 1: exactly 32 active
  n_survivors: 24                 # elite carried into the next generation unchanged
  n_offspring: 6                  # children produced from survivors by mutation
  n_immigrants: 2                 # novel candidates, unrelated to any survivor
  # INVARIANT: n_survivors + n_offspring + n_immigrants == population_size
  max_generations: 30
  seed: 42
  max_wall_clock_s: 21600
  max_evaluations: 1000           # counted into the deflated Sharpe's M (spec 14.4)
  stop_on_no_improvement_generations: 8
  min_improvement: 0.005          # fitness delta that counts as an improvement

  mutation:
    parameter_rate: 0.7           # P(child receives at least one parameter mutation)
    structural_rate: 0.3          # P(child receives at least one structural mutation)
    max_mutations_per_child: 3
    max_repair_attempts: 3        # invalid child -> redraw; then fall back to an immigrant
    parameter:
      perturb_pct: 0.25           # x *= 1 +/- U(0, perturb_pct)
      jump_probability: 0.15      # otherwise resample uniformly from the ParamSpec range
      risk_perturb_pct: 0.35      # stop-loss / take-profit / trailing / sizing move further
    structural:                   # relative weights, normalised at load;
      add_confirmation: 0.22      # one key per operator in the spec 13.4 table
      remove_confirmation: 0.18
      modify_entry: 0.18
      modify_exit: 0.13
      add_filter: 0.09
      remove_filter: 0.09
      replace_indicator: 0.07
      change_tree_mode: 0.04

  diversity:
    max_pairwise_similarity: 0.90 # a survivor too similar to a fitter one is skipped
    min_population_diversity: 0.35
    structural_weight: 0.4        # behaviour is weighted higher than structure on purpose:
    behavioural_weight: 0.6       # two strategies that trade alike are one strategy
    immigrant_boost: 2            # extra immigrants while diversity is below the floor
    max_immigrants: 8             # INVARIANT: <= n_offspring + n_immigrants, because a
                                  # boost displaces offspring and never a survivor

  fitness:                        # spec 13.3; weights MUST sum to 1.0
    weights:
      expectancy: 0.20
      profit_factor: 0.12
      risk_adjusted: 0.15
      drawdown: 0.15
      consistency: 0.12
      inner_oos: 0.12
      trades: 0.06
      win_rate: 0.04              # deliberately tiny, and behind a hard expectancy gate
      net_return: 0.02            # deliberately tiny: profit is not the objective
      concentration: 0.02
    targets:
      expectancy_pct: 0.002
      profit_factor: 1.5
      sortino: 1.5
      cagr: 0.20
      trades: 200
      win_rate: 0.55
      win_rate_floor: 0.35
      drawdown_ceiling: 0.35
      consistency_period_bars: 720
    gates:                        # failing any gate sets fitness to FITNESS_REJECTED
      min_expectancy_pct: 0.0
      min_trades: 30
      # Drawdown is judged against buy-and-hold over the SAME window (ADR 0012).
      # 1.0 = may not be worse on drawdown than holding the asset. BTC B&H draws
      # down 70-84%, so the old absolute 0.50 demanded a strategy be twice as
      # good on risk as the asset and could not tell 55%-when-B&H-was-80% from
      # 45%-when-B&H-was-30%.
      max_drawdown_vs_benchmark: 1.00
      # Used only when no benchmark exists for the window. Not a second gate.
      max_drawdown: 1.00
      min_retention_top1: 0.0     # must still be profitable without its single best trade
    penalties:
      drawdown_soft: 0.20
      trades_soft: 100
      instability_max_cv: 0.60
      sensitivity_max_drop: 0.50
      divergence_min_ratio: 0.50
      complexity_free_params: 6
      complexity_logic_lines: 150
      removal_k: [1, 3, 5]        # spec 14.4 trade-removal test
      removal_floor: [0.40, 0.20, 0.10]
      removal_target: [0.80, 0.65, 0.55]

  inner_walkforward:              # out-of-sample *inside train*; never touches validation
    n_folds: 4
    scheme: rolling               # rolling | anchored
    embargo_bars: 24

  promotion:                      # the only route from evolution to the validation segment
    every_generations: 0          # 0 = only after the final generation
    n_promote: 3
    min_fitness: 0.35
    max_similarity_between_promoted: 0.80
    counts_as_validation_touch: true

  genome:                         # structural limits (spec 9.6)
    max_conditions_entry: 4
    max_conditions_exit: 4
    max_filters: 3
    max_indicators: 6
    max_free_params: 6

walkforward:
  scheme: rolling                 # rolling | anchored
  is_bars: 13140                  # 18 months of 1h
  oos_bars: 2190                  # 3 months
  step_bars: 2190
  reoptimize_each_window: true
  evolution_generations: 8        # generations per IS window when optimize.engine == evolution

validation:
  min_trades_val: 30
  min_trades_train: 100
  max_single_trade_pct: 0.25
  sanity_drift_allowance: 0.5    # G_SANITY slack; the cap bounds the target, not the drift (§14.3)
  cost_survival_multiplier: 2.0
  permutation:
    n_market_permutations: 200
    n_trade_shuffles: 1000
    block_len_bars: 168
    alpha: 0.05
  degradation_min_ratio: 0.5
  dsr_threshold: 0.95
  # Upper confidence bound on the trial-Sharpe dispersion (ADR 0011). A small
  # selection pool yields a harsher SR0 rather than no SR0. x1.92 at n=7,
  # x1.28 at n=30, x1.04 at n=1000.
  dsr_dispersion_alpha: 0.05
  pbo:
    n_blocks: 16
    max_combinations: 500
  sensitivity_max_drop: 0.5
  concentration_top_n: 5
  concentration_max_share: 0.5
  max_free_params: 6
  max_logic_lines: 150
  random_entry_seeds: 100
  score:
    candidate_max: 30
    weak_max: 60
  family_max_validation_touches: 20

lockbox:
  max_per_family: 1
  max_per_month: 3

# Per-generation hidden training environments (Project Rome sections 4-19).
# Rome's own randomisation service selects one of these per generation; neither a
# strategy nor the LLM may choose any field below for an individual run.
# Commission and execution timing are deliberately absent: they are structural
# properties of the venue (Rome sections 12, 13), not sources of uncertainty.
environment:
  enabled: true
  window_min_fraction: 0.35       # shortest window, as a fraction of train
  window_max_fraction: 0.75       # longest window
  length_step_fraction: 0.05      # spacing between window lengths in the pool
  stride_fraction: 0.02           # spacing between window start times
  min_window_bars: 200            # absolute floor; never sample less
  min_starting_capital: 5000.0    # realistic account sizes, quote currency
  max_starting_capital: 50000.0
  min_slippage_bps: 2.0           # realistic, bounded, venue-specific band
  max_slippage_bps: 8.0
  asset_universe: []              # empty means the split's own symbol
  min_assets: 1
  n_history_buckets: 20           # exposure tracking granularity
  overuse_factor: 1.75            # report a bucket above this multiple of uniform

llm:
  provider: glm                   # glm | mock
  model: glm-4-plus
  base_url: https://open.bigmodel.cn/api/paas/v4
  temperature_propose: 0.7
  temperature_repair: 0.2
  max_tokens: 8000
  timeout_s: 60
  max_retries: 3
  daily_cost_cap_eur: 10.0
  pricing_file: configs/llm_pricing.yaml

research:                         # LLM contribution to evolution (spec 12)
  max_seed_genomes: 8             # LLM-proposed genomes used to fill generation 0
  guided_mutation_share: 0.25     # share of offspring whose operator the LLM may suggest
  max_cost_eur: 20.0
  max_wall_clock_s: 14400
  max_repair_attempts: 2
  smoke_bars: 200

sandbox:
  cpu_seconds: 120
  memory_mb: 2048
  wall_clock_s: 300
  allowed_imports: [numpy, pandas, math, statistics, dataclasses, typing, quantlab.core.strategy, quantlab.core.indicators, quantlab.core.types]

paper:
  state_dir: ./artifacts/paper
  ws_url: wss://stream.binance.com:9443/ws
  backfill_limit: 1000
  alert_mdd_percentile: 95

logging:
  level: INFO
  json: true
  redact_keys: [api_key, secret, token, password, authorization]
